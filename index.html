<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Campusly — AI-Powered University Student Assistant</title>
    <meta name="description" content="Everything a university student needs in one place: AI presentation maker, focus study timer, expense tracker, planner, and university events." />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Campuly" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#0B0C10] text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-purple-100 selection:text-purple-900 transition-colors duration-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #F8FAFC; color: #0F172A;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
          <div style="width: 42px; height: 42px; border-radius: 12px; background: #2563EB; display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 20px; box-shadow: 0 4px 12px rgba(37,99,235,0.25);">
            C
          </div>
          <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #0F172A;">Campusly</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #64748B;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #2563EB; animation: campuslyPulse 1.2s infinite ease-in-out;"></div>
          <span>Loading Campusly Student OS...</span>
        </div>
        <style>
          @keyframes campuslyPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
          }
          @media (prefers-color-scheme: dark) {
            #root > div {
              background-color: #05070A !important;
              color: #F8FAFC !important;
            }
            #root > div span {
              color: #F8FAFC !important;
            }
            #root > div > div > span:last-child {
              color: #94A3B8 !important;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically clean up any stale service workers or cached application scripts
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((key) => {
            if (key.includes('campusly')) {
              caches.delete(key);
            }
          });
        }).catch(() => {});
      }
    </script>
  </body>
</html>
